<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>EventSpace | Ticket Booking</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="css/style.css" />
	</head>
	<body>
		<header class="py-4 mb-4">
			<div
				class="container d-flex justify-content-between align-items-center flex-wrap gap-2"
			>
				<div>
					<h2 class="m-0">🎟 EventSpace</h2>
					<small>Event Ticketing & Venue Booking</small>
				</div>
				<div id="identity" class="d-flex gap-2 align-items-center"></div>
			</div>
		</header>
		<main class="container pb-5">
			<div id="alert"></div>
			<div id="auth" class="row justify-content-center">
				<div class="col-lg-6">
					<div class="card p-4">
						<h4 id="authTitle">Sign in</h4>
						<form id="loginForm">
							<input
								class="form-control my-2"
								id="email"
								placeholder="Email"
								type="email"
								required
							/><input
								class="form-control my-2"
								id="password"
								placeholder="Password"
								type="password"
								required
								minlength="8"
							/><input
								class="form-control my-2 d-none"
								id="name"
								placeholder="Full name"
							/><button class="btn btn-primary w-100" id="authSubmit">
								Login
							</button>
						</form>
						<button
							class="btn btn-link"
							onclick="toggleRegister()"
							id="toggleText"
						>
							Create a customer account
						</button>
						<hr />
						<small
							>Demo users: admin@demo.test, organiser@demo.test,
							customer@demo.test<br />Password: Password123!</small
						>
					</div>
				</div>
			</div>
			<div id="app" class="d-none">
				<div class="d-flex flex-wrap gap-2 align-items-center mb-4">
					<button class="btn btn-primary" onclick="showTab('events')">
						Events</button
					><button
						class="btn btn-outline-primary"
						onclick="showTab('bookings')"
					>
						Bookings</button
					><button class="btn btn-outline-primary" onclick="showTab('venues')">
						Venues</button
					><button
						class="btn btn-outline-dark manager d-none"
						onclick="showTab('create')"
					>
						Add event</button
					><button
						class="btn btn-outline-dark manager d-none"
						onclick="showTab('createVenue')"
					>
						Add venue</button
					><button
						class="btn btn-outline-dark admin d-none"
						onclick="showTab('users')"
					>
						Users
					</button>
				</div>
				<section id="events">
					<div
						class="d-flex justify-content-between gap-2 align-items-center mb-3"
					>
						<h3>Upcoming events</h3>
						<input
							id="search"
							class="form-control"
							style="max-width: 250px"
							placeholder="Search event name"
						/>
					</div>
					<div id="eventList" class="row g-3"></div>
					<div class="my-3 d-flex align-items-center gap-3">
						<button class="btn btn-outline-secondary" onclick="loadEvents(-1)">
							Previous</button
						><span id="pageInfo"></span
						><button class="btn btn-outline-secondary" onclick="loadEvents(1)">
							Next
						</button>
					</div>
				</section>
				<section id="bookings" class="d-none">
					<h3>Bookings</h3>
					<div id="bookingList"></div>
				</section>
				<section id="venues" class="d-none">
					<h3>Venues</h3>
					<div id="venueList"></div>
				</section>
				<section id="create" class="d-none">
					<div class="card p-4" style="max-width: 700px">
						<h3>Create event</h3>
						<form id="eventForm">
							<label>Event title</label
							><input class="form-control mb-2" name="title" required /><label
								>Description</label
							><textarea class="form-control mb-2" name="description"></textarea
							><label>Venue</label
							><select
								id="venueSelect"
								class="form-select mb-2"
								name="venue_id"
								required
							></select
							><label>Date and time</label
							><input
								class="form-control mb-2"
								type="datetime-local"
								name="event_date"
								required
							/><label>Ticket price (RM)</label
							><input
								class="form-control mb-2"
								type="number"
								min="0"
								step=".01"
								name="ticket_price"
								required
							/><label>Tickets available</label
							><input
								class="form-control mb-2"
								type="number"
								min="1"
								name="total_tickets"
								required
							/><button class="btn btn-primary">Create event</button>
						</form>
					</div>
				</section>
				<section id="createVenue" class="d-none">
					<div class="card p-4" style="max-width: 700px">
						<h3>Create venue</h3>
						<form id="venueForm">
							<label>Venue name</label
							><input class="form-control mb-2" name="name" required /><label
								>Location</label
							><input class="form-control mb-2" name="address" required /><label
								>Capacity</label
							><input
								class="form-control mb-2"
								name="capacity"
								type="number"
								min="1"
								required
							/><button class="btn btn-primary">Save venue</button>
						</form>
					</div>
				</section>
				<section id="users" class="d-none">
					<h3>Users (administrator only)</h3>
					<div id="usersList"></div>
				</section>
			</div>
		</main>
		<script src="js/api.js"></script>
		<script src="js/auth.js"></script>
		<script src="js/events.js"></script>
		<script src="js/bookings.js"></script>
		<script src="js/venues.js"></script>
		<script src="js/users.js"></script>
		<script src="js/app.js"></script>
	</body>
</html>
