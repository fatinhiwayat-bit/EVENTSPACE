<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Organiser Portal | EventSpace</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body class="bg-light">
        <!-- HEADER CLEAN CORPORATE -->
        <header class="py-3 mb-4 bg-dark text-white border-bottom border-primary border-3 shadow-sm">
            <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div class="d-flex align-items-center gap-2">
                    <span class="fs-3">🎟️</span>
                    <div>
                        <h3 class="m-0 text-white fw-bold">EventSpace <span class="badge bg-primary fs-6">Organiser</span></h3>
                        <small class="text-light opacity-75">Staff & Event Management Portal</small>
                    </div>
                </div>
                <div id="identity" class="d-flex gap-2 align-items-center"></div>
            </div>
        </header>

        <main class="container pb-5">
            <div id="alert"></div>

            <!-- LOGIN SECTION -->
            <div id="auth" class="row justify-content-center">
                <div class="col-lg-5">
                    <div class="card p-4 shadow-sm border-0 rounded-3">
                        <h4 id="authTitle" class="mb-3 text-primary fw-bold">Organiser Portal Login</h4>
                        <form id="loginForm">
                            <label class="form-label text-muted small">Email Address</label>
                            <input
                                class="form-control mb-2"
                                id="email"
                                placeholder="organiser@demo.test"
                                type="email"
                                required
                            />
                            <label class="form-label text-muted small">Password</label>
                            <input
                                class="form-control mb-3"
                                id="password"
                                placeholder="••••••••"
                                type="password"
                                required
                                minlength="8"
                            />
                            <input
                                class="form-control mb-2 d-none"
                                id="name"
                                placeholder="Full name"
                            />
                            <button class="btn btn-primary w-100 fw-bold py-2" id="authSubmit">
                                Sign In
                            </button>
                        </form>
                        <button
                            class="btn btn-link text-decoration-none mt-2 text-muted small"
                            onclick="toggleRegister()"
                            id="toggleText"
                        >
                            Create a customer account
                        </button>
                        <hr />
                        <div class="p-2 bg-light rounded text-muted small">
                            <strong>Demo Organiser:</strong> organiser@demo.test<br />
                            <strong>Password:</strong> Password123!
                        </div>
                    </div>
                </div>
            </div>

            <!-- DASHBOARD & MAIN APP SECTION -->
            <div id="app" class="d-none">

                <!-- NAVIGATION BAR (ONE THEME COLOR) -->
                <div class="d-flex flex-wrap gap-2 align-items-center mb-4 p-2 bg-white rounded shadow-sm border">
                    <button class="btn btn-primary fw-bold" onclick="showTab('events')">
                        📅 My Events
                    </button>
                    <button class="btn btn-outline-primary fw-bold" onclick="showTab('bookings')">
                        🎟️ Incoming Bookings
                    </button>
                    <button class="btn btn-outline-secondary fw-bold" onclick="showTab('venues')">
                        🏢 Venues
                    </button>
                    <button
                        class="btn btn-primary manager ms-auto"
                        onclick="showTab('create')"
                    >
                        + Add Event
                    </button>
                    <button
                        class="btn btn-outline-primary manager"
                        onclick="showTab('createVenue')"
                    >
                        + Add Venue
                    </button>
                    <button
                        class="btn btn-outline-danger admin d-none"
                        onclick="showTab('users')"
                    >
                        👥 Users
                    </button>
                </div>

                <!-- SECTION: EVENTS LIST -->
                <section id="events">
                    <div class="d-flex justify-content-between gap-2 align-items-center mb-3">
                        <h4 class="fw-bold text-dark m-0">Event Management</h4>
                        <input
                            id="search"
                            class="form-control shadow-sm"
                            style="max-width: 250px"
                            placeholder="🔍 Search events..."
                        />
                    </div>
                    <div id="eventList" class="row g-3"></div>
                    <div class="my-4 d-flex align-items-center gap-3 justify-content-center">
                        <button class="btn btn-outline-secondary btn-sm" onclick="loadEvents(-1)">
                            ← Previous
                        </button>
                        <span id="pageInfo" class="fw-bold text-muted"></span>
                        <button class="btn btn-outline-secondary btn-sm" onclick="loadEvents(1)">
                            Next →
                        </button>
                    </div>
                </section>

                <!-- SECTION: BOOKINGS LIST & QR CODE -->
                <section id="bookings" class="d-none">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="fw-bold text-dark m-0">Customer Bookings & QR Verification</h4>
                        <span class="badge bg-primary">QR API Connected</span>
                    </div>
                    <div id="bookingList"></div>
                </section>

                <!-- SECTION: VENUES -->
                <section id="venues" class="d-none">
                    <h4 class="fw-bold text-dark mb-3">Available Venues</h4>
                    <div id="venueList"></div>
                </section>

                <!-- SECTION: CREATE EVENT -->
                <section id="create" class="d-none">
                    <div class="card p-4 shadow-sm border-0" style="max-width: 700px">
                        <h4 class="fw-bold text-primary mb-3">Create New Event</h4>
                        <form id="eventForm">
                            <label class="form-label fw-bold">Event Title</label>
                            <input class="form-control mb-3" name="title" required placeholder="e.g. Tech Conference 2026" />

                            <label class="form-label fw-bold">Description</label>
                            <textarea class="form-control mb-3" name="description" rows="3" placeholder="Brief event summary..."></textarea>

                            <label class="form-label fw-bold">Select Venue</label>
                            <select
                                id="venueSelect"
                                class="form-select mb-3"
                                name="venue_id"
                                required
                            ></select>

                            <div class="row">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Date and Time</label>
                                    <input
                                        class="form-control mb-3"
                                        type="datetime-local"
                                        name="event_date"
                                        required
                                    />
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label fw-bold">Price (RM)</label>
                                    <input
                                        class="form-control mb-3"
                                        type="number"
                                        min="0"
                                        step=".01"
                                        name="ticket_price"
                                        required
                                    />
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label fw-bold">Total Tickets</label>
                                    <input
                                        class="form-control mb-3"
                                        type="number"
                                        min="1"
                                        name="total_tickets"
                                        required
                                    />
                                </div>
                            </div>

                            <button class="btn btn-primary fw-bold w-100 py-2 mt-2">Publish Event</button>
                        </form>
                    </div>
                </section>

                <!-- SECTION: CREATE VENUE -->
                <section id="createVenue" class="d-none">
                    <div class="card p-4 shadow-sm border-0" style="max-width: 700px">
                        <h4 class="fw-bold text-dark mb-3">Add New Venue</h4>
                        <form id="venueForm">
                            <label class="form-label fw-bold">Venue Name</label>
                            <input class="form-control mb-3" name="name" required />

                            <label class="form-label fw-bold">Address / Location</label>
                            <input class="form-control mb-3" name="address" required />

                            <label class="form-label fw-bold">Capacity</label>
                            <input
                                class="form-control mb-3"
                                name="capacity"
                                type="number"
                                min="1"
                                required
                            />

                            <button class="btn btn-primary fw-bold w-100 py-2 mt-2">Save Venue</button>
                        </form>
                    </div>
                </section>

                <!-- SECTION: USERS -->
                <section id="users" class="d-none">
                    <h4 class="fw-bold text-dark mb-3">Users Management</h4>
                    <div id="usersList"></div>
                </section>

            </div>
        </main>

        <script src="js/api.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/events.js"></script>
        <script src="js/bookings.js"></script>
        <script src="js/venues.js"></script>
        <script src="js/users.js"></script>
        <script src="js/app.js"></script>
    </body>
</html>
